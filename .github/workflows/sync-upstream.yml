name: Sync upstream and Codex plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git remote add upstream https://github.com/mattpocock/skills.git
      - run: git fetch upstream main
      - run: git config user.name "mantrandev"
      - run: git config user.email "mantrandev@gmail.com"
      - run: git merge --no-edit upstream/main
      - run: ./scripts/sync-codex-plugin.sh
      - run: git add .agents/plugins/marketplace.json plugins/mattpocock-skills
      - run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(codex): sync plugin"
      - run: git push origin main
